function showPortfolio(){
  const portfolioSection = document.getElementById('portfolio');
  const showBtn = document.getElementById('showBtn');
  portfolioSection.style.display = 'block';
  showBtn.style.display = 'none';
  setTimeout(() => {
    portfolioSection.scrollIntoView({behavior:'smooth', block: 'center'});
  }, 50);
}

let typingInterval;

function findPortfolio(){
  const id=document.getElementById("delegateID").value.trim().toUpperCase();
  const r=document.getElementById("result");
  
  clearInterval(typingInterval);
  r.innerHTML = "";
  
  let resultText = "";
  
  if(!id.match(/^HRC\d{2}$/)){
    resultText = "Error: Invalid format.\nPlease use HRC01 to HRC29";
    r.style.color = "#ff4757";
  }
  else if(delegates[id]){
    resultText = `Authentication Successful.\nDelegate: ${delegates[id].name}\nAllotment: ${delegates[id].country}`;
    r.style.color = "#00d4ff";
  }
  else{
    resultText = "Error: ID not found in registry.";
    r.style.color = "#ff4757";
  }

  let i = 0;
  r.innerHTML = '<span class="typing-cursor"></span>';
  
  typingInterval = setInterval(() => {
    if (i < resultText.length) {
      let currentText = resultText.substring(0, i + 1).replace(/\n/g, "<br>");
      r.innerHTML = currentText + '<span class="typing-cursor"></span>';
      i++;
    } else {
      clearInterval(typingInterval);
    }
  }, 40); 
}

document.getElementById("delegateID").addEventListener("keydown", function(e){
  if(e.key==="Enter"){
    findPortfolio();
  }
});

window.addEventListener("load", () => {
  setTimeout(()=>{
    document.getElementById("pageLoader").classList.add("hide");
  }, 800);
});
</script>
