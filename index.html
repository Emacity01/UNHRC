<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UNHRC Portfolio Access • Emacity MUN</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#0b0f1a,#111a2e);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    background:#1b2742;
    padding:40px;
    border-radius:12px;
    text-align:center;
    width:360px;
    box-shadow:0 0 30px rgba(0,0,0,0.6);
}
input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    margin:15px 0;
    font-size:16px;
}
button{
    padding:12px 20px;
    background:#00b4ff;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:600;
    cursor:pointer;
}
#result{
    margin-top:20px;
    font-size:15px;
    white-space:pre-line;
}
</style>
</head>
<body>

<div class="card">
    <h2>UNHRC Portfolio Access</h2>
    <p>Enter your Delegate ID</p>
    <input id="delegateID" placeholder="HRC01 / hrc1" />
    <button onclick="find()">Access Portfolio</button>
    <div id="result"></div>
</div>

<script>
const delegates = {
"HRC01": { name:"Syed Arahan", country:"United States of America" },
"HRC02": { name:"Jyash Ashish Tholiya", country:"Russian Federation" },
"HRC03": { name:"Jhanvi Ranjan", country:"Islamic Republic of Iran" },
"HRC04": { name:"Kartikeya Deshmukh", country:"United Kingdom" },
"HRC05": { name:"Arayna Chharia", country:"Netherlands" },

"HRC07": { name:"Grishma Kshirsagar", country:"New Zealand" },

"HRC09": { name:"Siddharth Dongre", country:"China" },

"HRC12": { name:"Rajsi Takale", country:"Israel" },
"HRC13": { name:"Rutvij Takale", country:"South Africa" },
"HRC14": { name:"Atharva Saraf", country:"India" },
"HRC15": { name:"Advait Chidhanand", country:"Indonesia" },
"HRC16": { name:"Aarush Chandel", country:"Bangladesh" },
"HRC17": { name:"Ananya Shinde", country:"Norway" },
"HRC18": { name:"Vidhyesh Dabholkar", country:"Mexico" },

"HRC20": { name:"Shiv Talesara", country:"Syria" },

"HRC23": { name:"Shlok Patwardhan", country:"North Korea" },

"HRC28": { name:"Rabreet Kaur", country:"Brazil" },
"HRC29": { name:"Saanvi Sharma", country:"Yemen" }
};

function formatID(val){
  let num = val.replace(/\D/g,'');
  if(!num) return "";
  if(num.length===1) num = "0"+num;
  return "HRC"+num;
}

function find(){
  const raw = document.getElementById("delegateID").value.trim().toUpperCase();
  const id = formatID(raw);
  const r = document.getElementById("result");

  if(!id){
    r.textContent="Please enter a valid ID.";
    return;
  }

  if(delegates[id]){
    r.textContent =
`Authentication Successful

Delegate : ${delegates[id].name}
Country  : ${delegates[id].country}`;
  } else {
    r.textContent="No delegate found. Check your ID and try again.";
  }
}
</script>

</body>
</html>
